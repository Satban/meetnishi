<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing you in… — Nishi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/nishi_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .pulse {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-tint);
      margin: 0 auto var(--space-md);
      position: relative;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .pulse::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: var(--accent);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><img src="assets/nishi_logo.png" alt="Nishi"></a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card" id="verify-card" style="text-align: center;">
      <div class="pulse"></div>
      <h1 id="verify-title" style="font-size: 26px;">Signing you in…</h1>
      <p id="verify-sub" class="auth-sub">One moment.</p>

      <p class="auth-switch" id="verify-actions" style="margin-top: var(--space-lg); display: none;">
        <a href="signin.html">Try again</a> or <a href="forgot.html">request a new link</a>.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/auth.js"></script>
  <script>
    (function () {
      const title = document.getElementById('verify-title');
      const sub = document.getElementById('verify-sub');
      const actions = document.getElementById('verify-actions');
      const pulse = document.querySelector('.pulse');

      function showError(msg) {
        if (pulse) pulse.style.display = 'none';
        title.textContent = 'That link did not work';
        sub.textContent = msg || 'It may have expired or been used already.';
        actions.style.display = 'block';
      }

      function goAccount() {
        title.textContent = 'You are signed in.';
        sub.textContent = 'Taking you to your account…';
        setTimeout(() => { window.location.href = '/account.html'; }, 600);
      }

      // Surface any explicit error in the URL hash
      const hash = window.location.hash || '';
      if (hash.includes('error=')) {
        const params = new URLSearchParams(hash.replace(/^#/, ''));
        const desc = params.get('error_description') || params.get('error');
        showError(desc ? decodeURIComponent(desc.replace(/\+/g, ' ')) : '');
        return;
      }

      // Wait for Supabase to detect the session from the URL
      const timeout = setTimeout(() => showError(), 8000);

      function check() {
        if (!window.NishiAuth) {
          setTimeout(check, 100);
          return;
        }
        window.NishiAuth.onSession((session) => {
          if (session) {
            clearTimeout(timeout);
            goAccount();
          }
        });
        // Also try a direct read in case the event already fired
        window.NishiAuth.getSession().then((session) => {
          if (session) {
            clearTimeout(timeout);
            goAccount();
          }
        });
      }
      check();
    })();
  </script>
</body>
</html>
