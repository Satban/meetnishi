<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Nishi</title>
  <!-- A0 smart link: creator /r/?c=<slug>. Store-first (health app: install, try, then buy). Records the click
       server-side (authoritative, for the web path), then routes by device:
         iOS/iPadOS  -> App Store (Apple strips install referrers; in-app attribution is the paywall code field).
         Android     -> Play Store WITH &referrer=utm_...campaign=<slug> so Play Install Referrer delivers the
                        creator slug to the app on first open (zero-touch attribution; parsed by the client
                        Install Referrer service, source='install_referrer').
         Desktop     -> /pricing.html?ref=<slug> (no app to install; web checkout carries the ref).
       Fail-open: on any error the visitor still reaches a store / pricing. The SERVER enforces the window +
       eligibility + US-gate; nothing here mints a discount. -->
  <script src="/scripts/config.js"></script>
  <style>body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:#6d6053;text-align:center;margin-top:56px}</style>
</head>
<body>
  <p>Taking you to Nishi…</p>
  <script>
    (function () {
      'use strict';
      var APP_STORE = 'https://apps.apple.com/us/app/nishi-your-nutrition-companion/id6759352471';
      var PLAY_ID = 'com.getfoil.app';
      var c = '';
      try { c = (new URLSearchParams(location.search).get('c') || '').trim(); } catch (_) {}

      var ua = navigator.userAgent || navigator.vendor || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports MacIntel
      var isAndroid = /Android/i.test(ua);

      var routed = false;
      function route() {
        if (routed) return; routed = true;
        if (isIOS) { location.replace(APP_STORE); return; }
        if (isAndroid) {
          // Play Install Referrer carries the slug to the app on first open (no SDK). UTM scheme matches the
          // web checkout so the client extracts the slug from utm_campaign consistently.
          var ref = c ? encodeURIComponent('utm_source=affiliate&utm_medium=creator&utm_campaign=' + c) : '';
          location.replace('https://play.google.com/store/apps/details?id=' + PLAY_ID + (ref ? ('&referrer=' + ref) : ''));
          return;
        }
        // Desktop / unknown: web checkout, carry the code in the URL (survives blocked storage).
        location.replace('/pricing.html' + (c ? ('?ref=' + encodeURIComponent(c)) : ''));
      }

      // No slug or no config -> just route (still store-first / pricing).
      if (!c || !window.NISHI_CONFIG) { return route(); }

      // Fresh click for THIS creator (for the web path + analytics): stash the raw slug, drop any stale click id.
      try { localStorage.setItem('affiliate_ref', c); } catch (_) {}
      try { localStorage.removeItem('affiliate_click_id'); } catch (_) {}

      // Safety: never let a slow capture-click hang the redirect.
      var timer = setTimeout(route, 800);

      fetch(window.NISHI_CONFIG.supabaseUrl + '/functions/v1/capture-click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': window.NISHI_CONFIG.supabaseAnonKey },
        body: JSON.stringify({ code_or_slug: c }),
        keepalive: true  // let the click record survive the imminent store/pricing redirect
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.recorded && d.click_id) {
            try { localStorage.setItem('affiliate_click_id', d.click_id); } catch (_) {}
          }
        })
        .catch(function () { /* keep the raw slug already stored */ })
        .finally(function () { clearTimeout(timer); route(); });
    })();
  </script>
</body>
</html>
