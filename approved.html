<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Post approved</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Archivo", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #FAF7F0; color: #2A2520; }
    .card { background: #fff; padding: 48px; border-radius: 24px; text-align: center; box-shadow: 0 24px 60px rgba(42,37,32,0.10); max-width: 420px; margin: 20px; }
    .icon { font-size: 60px; margin-bottom: 16px; }
    h1 { color: #DD6C59; margin: 0 0 12px; font-size: 26px; }
    p { color: #6B6258; margin: 0; line-height: 1.6; }
    .topic { background: #FAE7E0; color: #C75A48; padding: 12px 16px; border-radius: 12px; margin-top: 20px; font-weight: 600; font-size: 14px; word-break: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Post approved</h1>
    <p>Publishing now. It will be live on meetnishi.com shortly.</p>
    <div class="topic" id="topic"></div>
  </div>
  <script>
    const t = new URLSearchParams(location.search).get("topic");
    const el = document.getElementById("topic");
    if (t) { el.textContent = t; } else { el.style.display = "none"; }
  </script>
</body>
</html>
