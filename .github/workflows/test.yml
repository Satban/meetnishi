name: Unit tests

# Runs on every push and PR so a branch goes red before it reaches main.
# deploy.yml runs the same tests as a gate on the deploy itself.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test scripts/*.test.mjs
