<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing you in… | Nishi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .pulse {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-tint);
      margin: 0 auto var(--space-md);
      position: relative;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .pulse::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: var(--accent);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><img src="assets/nishi_wordmark.png" alt="Nishi"></a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card" id="verify-card" style="text-align: center;">
      <div class="pulse"></div>
      <h1 id="verify-title" style="font-size: 26px;">Signing you in…</h1>
      <p id="verify-sub" class="auth-sub">One moment.</p>

      <p class="auth-switch" id="verify-actions" style="margin-top: var(--space-lg); display: none;">
        <a href="signin.html">Try again</a>.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="scripts/config.js"></script>
  <script src="scripts/auth.js"></script>
  <script type="module">
    import * as NexusJoin from "/scripts/nexus-join.js";
    window.NexusJoin = NexusJoin;
  </script>
  <script>
    (function () {
      const title = document.getElementById('verify-title');
      const sub = document.getElementById('verify-sub');
      const actions = document.getElementById('verify-actions');
      const pulse = document.querySelector('.pulse');

      function showError(msg) {
        if (pulse) pulse.style.display = 'none';
        title.textContent = 'That link did not work';
        sub.textContent = msg || 'It may have expired or been used already.';
        actions.style.display = 'block';
      }

      // onSession and getSession can both fire; navigate exactly once (Nexus plan, review #4).
      let navigated = false;
      async function goAccount(session) {
        if (navigated) return;
        navigated = true;
        let dest = '/account.html';
        try {
          const stash = sessionStorage.getItem('nexus_return');
          if (stash) {
            // nexus-join.js is a module (deferred); give it up to 2 s to load.
            for (let i = 0; i < 20 && !window.NexusJoin; i++) await new Promise(r => setTimeout(r, 100));
            if (window.NexusJoin) dest = window.NexusJoin.verifyDestination(stash, Date.now());
            sessionStorage.removeItem('nexus_return');
            const uid = session && session.user && session.user.id;
            if (dest !== '/account.html' && uid) {
              // One-shot token bound to THIS account; the Nexus page auto-activates only for it.
              sessionStorage.setItem('nexus_just_signed_in', JSON.stringify({ uid: uid, at: Date.now() }));
            }
          }
        } catch (_) { dest = '/account.html'; }
        title.textContent = 'You are signed in.';
        sub.textContent = dest === '/account.html' ? 'Taking you to your account…' : 'Taking you back…';
        setTimeout(() => { window.location.href = dest; }, 600);
      }

      // Surface any explicit error in the URL hash
      const hash = window.location.hash || '';
      if (hash.includes('error=')) {
        const params = new URLSearchParams(hash.replace(/^#/, ''));
        const desc = params.get('error_description') || params.get('error');
        showError(desc ? decodeURIComponent(desc.replace(/\+/g, ' ')) : '');
        return;
      }

      // Wait for Supabase to detect the session from the URL
      const timeout = setTimeout(() => showError(), 8000);

      function check() {
        if (!window.NishiAuth) {
          setTimeout(check, 100);
          return;
        }
        window.NishiAuth.onSession((session) => {
          if (session) {
            clearTimeout(timeout);
            goAccount(session);
          }
        });
        // Also try a direct read in case the event already fired
        window.NishiAuth.getSession().then((session) => {
          if (session) {
            clearTimeout(timeout);
            goAccount(session);
          }
        });
      }
      check();
    })();
  </script>
</body>
</html>
