<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying… — Nishi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/nishi_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .pulse {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-tint);
      margin: 0 auto var(--space-md);
      position: relative;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .pulse::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: var(--accent);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><img src="assets/nishi_logo.png" alt="Nishi"></a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card" style="text-align: center;">
      <div class="pulse"></div>
      <h1 style="font-size: 26px;">Verifying your link…</h1>
      <p class="auth-sub">You'll be signed in shortly.</p>

      <p class="auth-switch" style="margin-top: var(--space-lg);">
        Stuck? <a href="signin.html">Try again</a> or <a href="forgot.html">request a new link</a>.
      </p>
    </div>
  </main>

  <script src="scripts/main.js"></script>
</body>
</html>
