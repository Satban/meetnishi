name: Unit tests

# Runs on every push and PR so a branch goes red before it reaches main.
# deploy.yml runs the same tests as a gate on the deploy itself.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test scripts/*.test.mjs

  # Same build + built-site checks as deploy.yml, so a PR goes red before merge.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Check built site
        run: node scripts/check-built-site.mjs
